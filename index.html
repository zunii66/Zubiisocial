<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MyData</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-container .logo {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }
        
        .login-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 5px;
            font-size: 28px;
        }
        
        .login-container .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 600;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }
        
        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-group input::placeholder {
            color: #bbb;
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            cursor: pointer;
        }
        
        .remember-me input {
            width: auto;
        }
        
        .forgot-password {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .forgot-password:hover {
            text-decoration: underline;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            text-align: center;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }
        
        .message.success {
            background: #c6f6d5;
            color: #22543d;
            border-left: 4px solid #48bb78;
            display: block;
        }
        
        .message.error {
            background: #fed7d7;
            color: #742a2a;
            border-left: 4px solid #e53e3e;
            display: block;
        }
        
        .message.info {
            background: #bee3f8;
            color: #2a4365;
            border-left: 4px solid #4299e1;
            display: block;
        }
        
        .signup-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 15px;
        }
        
        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .signup-link a:hover {
            text-decoration: underline;
        }
        
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #aaa;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .divider span {
            padding: 0 15px;
            font-size: 13px;
        }
        
        .admin-link {
            text-align: center;
            margin-top: 10px;
        }
        
        .admin-link a {
            color: #888;
            text-decoration: none;
            font-size: 13px;
        }
        
        .admin-link a:hover {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🔐</div>
        <h2>Welcome Back!</h2>
        <p class="subtitle">Login to your account to continue</p>
        
        <div class="message" id="message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label>📧 Email Address</label>
                <input type="email" id="loginEmail" placeholder="Enter your email" required autocomplete="email">
            </div>
            
            <div class="form-group">
                <label>🔒 Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
            </div>
            
            <div class="remember-forgot">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe"> Remember me
                </label>
                <a href="#" class="forgot-password" onclick="forgotPassword()">Forgot Password?</a>
            </div>
            
            <button type="submit" id="loginBtn">
                <span id="btnText">🚀 Login</span>
                <span id="btnLoader" style="display:none;">
                    <span class="loader"></span> Logging in...
                </span>
            </button>
        </form>
        
        <div class="divider">
            <span>OR</span>
        </div>
        
        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
        
        <div class="admin-link">
            <a href="admin.html">👑 Admin Login</a>
        </div>
    </div>

    <script type="module">
        // Firebase Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            sendPasswordResetEmail,
            setPersistence,
            browserLocalPersistence,
            browserSessionPersistence,
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBH00UZAIJd8vRAEqbGV391YTA2Fae2cCM",
            authDomain: "mydata-11fdb.firebaseapp.com",
            projectId: "mydata-11fdb",
            storageBucket: "mydata-11fdb.firebasestorage.app",
            messagingSenderId: "824237451051",
            appId: "1:824237451051:web:db656d9ddedafa54aa476e",
            measurementId: "G-DBTR8K5PBV"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        console.log("✅ Firebase initialized!");

        // Check if already logged in
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // User is already logged in
                const userDoc = await getDoc(doc(db, "Users", user.uid));
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    if (userData.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    window.location.href = 'dashboard.html';
                }
            }
        });

        // Login Form Handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            const messageDiv = document.getElementById('message');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');

            // Hide previous messages
            messageDiv.style.display = 'none';
            messageDiv.className = 'message';

            // Validation
            if (!email || !password) {
                showMessage('❌ Please enter email and password!', 'error');
                return;
            }

            // Show loading
            loginBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline';

            try {
                // Set persistence based on Remember Me
                if (rememberMe) {
                    await setPersistence(auth, browserLocalPersistence);
                } else {
                    await setPersistence(auth, browserSessionPersistence);
                }

                // Sign in
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                console.log("✅ Login successful:", user.email);

                // Check user role from Firestore
                const userDoc = await getDoc(doc(db, "Users", user.uid));
                
                showMessage('✅ Login successful! Redirecting...', 'success');

                setTimeout(() => {
                    if (userDoc.exists() && userDoc.data().role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }, 1000);

            } catch (error) {
                console.error("❌ Login error:", error);
                
                let errorMessage = 'Login failed!';
                
                switch (error.code) {
                    case 'auth/invalid-credential':
                        errorMessage = '❌ Invalid email or password!';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = '❌ Invalid email format!';
                        break;
                    case 'auth/user-disabled':
                        errorMessage = '❌ This account has been disabled!';
                        break;
                    case 'auth/user-not-found':
                        errorMessage = '❌ No account found with this email!';
                        break;
                    case 'auth/wrong-password':
                        errorMessage = '❌ Incorrect password!';
                        break;
                    case 'auth/too-many-requests':
                        errorMessage = '❌ Too many attempts! Please try again later.';
                        break;
                    case 'auth/network-request-failed':
                        errorMessage = '❌ Network error! Check your connection.';
                        break;
                    default:
                        errorMessage = '❌ ' + error.message;
                }
                
                showMessage(errorMessage, 'error');
                
                // Reset button
                loginBtn.disabled = false;
                btnText.style.display = 'inline';
                btnLoader.style.display = 'none';
            }
        });

        // Forgot Password
        window.forgotPassword = async function() {
            const email = document.getElementById('loginEmail').value.trim();
            
            if (!email) {
                showMessage('❌ Please enter your email first!', 'error');
                return;
            }

            if (!confirm(`Send password reset email to ${email}?`)) {
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                showMessage('✅ Password reset email sent! Check your inbox.', 'success');
            } catch (error) {
                console.error("Reset error:", error);
                showMessage('❌ Error: ' + error.message, 'error');
            }
        };

        // Helper function
        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
            
            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 3000);
            }
        }
    </script>
</body>
</html>
